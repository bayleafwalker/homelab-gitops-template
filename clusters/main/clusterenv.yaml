# Sample only — fill in your own values, then encrypt with SOPS before
# committing (`.sops.yaml` already has an age rule for this file).
#
# Purpose:
# - talhelper/clustertool reads this file when rendering Talos machine configs.
# - Flux uses matching values from `flux-system/flux/clustersettings.secret.yaml`
#   and `cluster-secrets.secret.yaml` for Kubernetes manifest substitution.
#
# Keep this file and the Flux substitution files in sync. It intentionally
# includes both non-sensitive defaults and placeholder secrets so newcomers can
# see the complete required input surface in one place.

###############################################################################
# 1. Cluster identity and required Talos/clustertool compatibility values
###############################################################################

# CLUSTERNAME is used by talconfig.yaml and backup paths. Rename from `homelab`
# if you want generated configs, backup folders, and local prompts to carry
# your cluster name.
CLUSTERNAME: homelab

# Label used to opt nodes into System Upgrade Controller plans. The same value
# is rendered into Talos node labels and Flux Plan nodeSelectors.
UPGRADE_NODE_LABEL: upgrade.example.com/enabled

# Opinionated default NTP server. Replace with your router, internal NTP, or
# another public source if desired.
NTP_SERVER: time.cloudflare.com

# Preferred API VIP used by talconfig.yaml. Pick an unused address on the
# cluster node subnet. It must not be the same as any node IP.
HOMELAB_API_VIP: 192.168.1.10

# Legacy/clustertool alias. Keep this equal to HOMELAB_API_VIP unless you also
# update all consumers. Some tooling expects VIP to exist even though the
# template mostly uses HOMELAB_API_VIP.
VIP: 192.168.1.10

# ClusterTool requires this preset in some flows. Keep it equal to CONTROL1_IP.
# The rest of the template uses CONTROL1_IP directly.
MASTER1IP: 192.168.1.11

###############################################################################
# 2. Physical node inventory for Talos machine config generation
###############################################################################

# The template ships with a larger reference topology: three control-plane
# nodes, two generic workers, and one GPU/Coral worker. For a 1-2 node cluster,
# trim `clusters/main/talos/talconfig.yaml` and remove unused entries here.

# Control-plane examples used by talconfig.yaml.
CONTROL1_IP: 192.168.1.11
CONTROL1_CIDR: 192.168.1.11/24
CONTROL1_MAC: "00:11:22:33:44:51"

CONTROL2_IP: 192.168.1.12
CONTROL2_CIDR: 192.168.1.12/24
CONTROL2_MAC: "00:11:22:33:44:52"

CONTROL3_IP: 192.168.1.13
CONTROL3_CIDR: 192.168.1.13/24
CONTROL3_MAC: "00:11:22:33:44:53"

# Worker examples. WORKER3_IP/WORKER4_IP are not in the default node list; they
# show how to reserve additional worker IPs before extending talconfig.yaml.
GPU_WORKER1_IP: 192.168.1.51
WORKER1_IP: 192.168.1.61
WORKER2_IP: 192.168.1.62
WORKER3_IP: 192.168.1.63
WORKER4_IP: 192.168.1.64

###############################################################################
# 3. Network plan
###############################################################################

# Recommended: use a dedicated subnet/VLAN for cluster nodes if your router and
# switch support it. That keeps Talos nodes, LoadBalancer IPs, storage access,
# and firewall policy isolated from general client devices. A flat LAN works
# for small labs, but reserve all node/VIP/LB addresses outside DHCP.
#
LAN_CIDR: 192.168.1.0/24
GATEWAY: 192.168.1.1

# Clear template names for the subnet where Talos nodes live. This may be a
# dedicated VLAN, another routed subnet, or the same flat LAN as above.
CLUSTER_NODE_GATEWAY: 192.168.1.1
CLUSTER_NODE_CIDR: 192.168.1.0/24

# Pod/service networks are internal to Kubernetes. Avoid overlap with LAN,
# VPN, Docker, and site-to-site networks.
PODNET: 172.16.0.0/16
SVCNET: 172.17.0.0/16
KUBERNETES_SERVICE_HOST_IP: 172.17.0.1
KUBERNETES_SERVICE_HOST_CIDR: 172.17.0.1/32

# Optional trusted VPN/site-to-site network allowed into selected internal
# services. Remove the matching policy entries if you do not have a VPN.
TRUSTED_VPN_CIDR: 10.0.0.0/24

# LoadBalancer pool advertised on the cluster subnet. Keep this range outside
# DHCP and outside node IPs. ClusterTool expects a complete preset surface here,
# even for services you later remove. HOMELAB_* names are the active variables
# used by Cilium/MetalLB resources; METALLB_RANGE is kept as a compatibility
# alias for older docs/manifests.
HOMELAB_METALLB_RANGE: 192.168.1.200-192.168.1.220
HOMELAB_LB_START: 192.168.1.200
HOMELAB_LB_STOP: 192.168.1.220
METALLB_RANGE: 192.168.1.200-192.168.1.220

# Fixed service IP presets. If you use ClusterTool, keep the full set defined
# and assign safe placeholder/reserved values. If you use the direct Talos/Flux
# path, a value is required only while a retained manifest references it.
GATEWAY_INTERNAL_IP: 192.168.1.219   # Bundled Gateway API HTTPS entrypoint.
POSTGRES_LB_IP: 192.168.1.220       # ClusterTool preset; Blocky DNS example may reference it.
REGISTRY_IP: 192.168.1.221          # Bundled registry mirror example; must be in your real pool if enabled.
REGISTRY_HOST: registry.apps.example.com
REGISTRY_SERVICE_ENDPOINT: docker-registry.registry.svc.cluster.local:5000
FORGEJO_SSH_IP: 192.168.1.218       # Bundled Forgejo SSH LoadBalancer example.
SHELL_IP: 192.168.1.217             # ClusterTool preset; Blocky DNS example may reference it.
LDAP_OUTPOST_IP: 192.168.1.216      # Bundled Authentik LDAP outpost example.
HEADLAMP_IP: 192.168.1.215          # ClusterTool preset; define even if Headlamp is disabled.
BLOCKY_IP: 192.168.1.205            # Bundled DNS sinkhole/cluster DNS frontend example.
OMADA_IP: 192.168.1.206             # Bundled Omada controller LoadBalancer example.

# Optional directory backend CIDR used by Authentik's example egress policy.
# If you do not integrate an external LDAP/directory backend, remove or disable
# that NetworkPolicy before bootstrap.
AUTHENTIK_DIRECTORY_BACKEND_CIDR: 192.168.1.59/32

###############################################################################
# 4. Domains, DNS, and certificates
###############################################################################

# DOMAIN_0 is the app zone used for HTTPRoute hosts, wildcard certificates, and
# Blocky/k8s_gateway. DOMAIN_HOST is a base/local infra zone used for names such
# as truenas.${DOMAIN_HOST} and opnsense.${DOMAIN_HOST}.
DOMAIN_0: apps.example.com
DOMAIN_HOST: example.com
DOMAIN_0_EMAIL: you@example.com

# Opinionated default: the bundled ClusterIssuer uses Cloudflare DNS-01. If you
# use Route53, Hetzner DNS, RFC2136, or another provider, replace the
# clusterissuer chart values/manifests and rename this variable to match your
# provider-specific secret.
DOMAIN_0_CLOUDFLARE_TOKEN: REPLACE_WITH_CLOUDFLARE_API_TOKEN

# LDAP/domain components used by Authentik/LDAP examples.
DC_0: example
DC_1: com
DN: dc=example, dc=com

# Used by Flux GitRepository/deploy-key examples.
GITHUB_REPOSITORY: git@github.com:your-username/your-homelab-repo.git

###############################################################################
# 5. Storage and backups
###############################################################################

# Optional NFS/RWX storage. TrueNAS is the opinionated example, but any stable
# NFS server can be used if you update PVCs and docs accordingly.
TRUENAS_IP: 192.168.1.33

# Opinionated S3-compatible object storage defaults. Many manifests still use
# the historical HETZNER_* names because the source repo used Hetzner Object
# Storage. They work with any S3-compatible provider if endpoint/bucket/keys are
# changed consistently.
HETZNER_S3_BUCKET_NAME: your-bucket-name
HETZNER_S3_BUCKET_ENDPOINT: hel1.your-objectstorage.com
HETZNER_ACCESS_KEY: REPLACE_WITH_HETZNER_ACCESS_KEY
HETZNER_SECRET_KEY: REPLACE_WITH_HETZNER_SECRET_KEY
HETZNER_API_TOKEN: REPLACE_WITH_HETZNER_API_TOKEN

# Generic S3 variables used by the custom-app-postgres example. Prefer these
# names for new services instead of adding more provider-specific variables.
S3_BACKUP_BUCKET: your-backup-bucket-name
S3_BACKUP_ENDPOINT: s3.your-objectstorage.com
S3_ACCESS_KEY: REPLACE_WITH_S3_ACCESS_KEY
S3_SECRET_KEY: REPLACE_WITH_S3_SECRET_KEY

###############################################################################
# 6. Core platform and app credentials
###############################################################################

AK_ADMIN_PASSWORD: REPLACE_WITH_RANDOM_PASSWORD
LLDAP_ADMIN_PASSWORD: REPLACE_WITH_RANDOM_PASSWORD
LDAP_OUTPOST_TOKEN: REPLACE_WITH_AUTHENTIK_OUTPOST_TOKEN
AUTHENTIK_CERT_SYNC_TOKEN: REPLACE_WITH_AUTHENTIK_API_TOKEN
CODE_ADMIN_PASSWORD: REPLACE_WITH_RANDOM_PASSWORD
COUCHDB_ADMIN_PASSWORD: REPLACE_WITH_RANDOM_PASSWORD
NEXTCLOUD_USERNAME: admin
NEXTCLOUD_PASSWORD: REPLACE_WITH_RANDOM_PASSWORD
NEXTCLOUD_CNPG_PASSWORD: REPLACE_WITH_RANDOM_PASSWORD
PAPERLESS_CNPG_PASSWORD: REPLACE_WITH_RANDOM_PASSWORD
VAULTWARDEN_ADMIN_TOKEN: REPLACE_WITH_RANDOM_TOKEN
VOLSYNC_RESTIC_PASSWORD: REPLACE_WITH_RANDOM_PASSWORD

###############################################################################
# 7. Optional integrations
###############################################################################

# Tailscale: useful for private admin access to the cluster without exposing
# management UIs publicly.
TAILSCALE_AUTHKEY: REPLACE_WITH_TAILSCALE_AUTH_KEY

# VPN examples. Keep only if you deploy workloads that need egress through a
# commercial VPN provider.
NORDVPN_USER: REPLACE_WITH_VPN_USERNAME
NORDVPN_PASSWORD: REPLACE_WITH_VPN_PASSWORD
NORDVPN_COUNTRY: Switzerland
NORDVPN_SERVER: ch000.nordvpn.com
NORDVPN_WIREGUARD_PRIVATE_KEY: REPLACE_WITH_WIREGUARD_PRIVATE_KEY
NORDVPN_WIREGUARD_PUBLIC_KEY: REPLACE_WITH_WIREGUARD_PUBLIC_KEY
PROTONVPN_WIREGUARD_PRIVATE_KEY: REPLACE_WITH_WIREGUARD_PRIVATE_KEY
PROTONVPN_WIREGUARD_PUBLIC_KEY: REPLACE_WITH_WIREGUARD_PUBLIC_KEY

# Notifications and home automation examples.
DISCORD_SEVEN_WEBHOOK_URL: https://discord.com/api/webhooks/REPLACE_WITH_WEBHOOK_ID/REPLACE_WITH_WEBHOOK_TOKEN
HOMEASSISTANT_URL: homeassistant.example.com
HOMEASSISTANT_USERNAME: bot
HOMEASSISTANT_TOKEN: REPLACE_WITH_HOMEASSISTANT_LONG_LIVED_TOKEN

# Mosquitto is useful for Home Assistant/IoT MQTT. Remove or leave placeholders
# if you do not deploy network/mosquitto.
MOSQUITTO_USERNAME: homelab_mosquitto
MOSQUITTO_PASSWORD: REPLACE_WITH_RANDOM_PASSWORD

# GitHub Actions Runner Controller example. Required only if you keep
# system/github-actions-runner.
GITHUB_APP_ID: "REPLACE_WITH_GITHUB_APP_ID"
GITHUB_APP_INSTALLATION_ID: "REPLACE_WITH_GITHUB_APP_INSTALLATION_ID"

# Uncomment if you need authenticated Docker Hub pulls to avoid rate limits.
# DOCKERHUB_USER: dockerhub-username
# DOCKERHUB_PASSWORD: dockerhub-password
