---
# Talos patch to configure containerd to use the local docker registry.
# Prefer the dedicated LoadBalancer endpoint and keep the internal service mirror.
#
# These variables are substituted by talhelper/clustertool from clusterenv.yaml
# during machine-config generation. Keep REGISTRY_HOST, REGISTRY_IP, and
# REGISTRY_SERVICE_ENDPOINT aligned with the registry service manifests if you
# enable the in-cluster registry.
machine:
  registries:
    mirrors:
      "${REGISTRY_HOST}":
        endpoints:
          - https://${REGISTRY_HOST}
      "${REGISTRY_SERVICE_ENDPOINT}":
        endpoints:
          - http://${REGISTRY_SERVICE_ENDPOINT}
      "${REGISTRY_IP}:5000":
        endpoints:
          - http://${REGISTRY_IP}:5000
    config:
      "${REGISTRY_SERVICE_ENDPOINT}":
        tls:
          insecureSkipVerify: true
      "${REGISTRY_IP}:5000":
        tls:
          insecureSkipVerify: true
