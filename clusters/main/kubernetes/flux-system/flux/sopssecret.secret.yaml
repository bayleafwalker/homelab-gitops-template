# Sample only — generate your own keypair with `age-keygen -o age.agekey`,
# put the PUBLIC key in .sops.yaml (used for encryption), and apply this
# secret directly to the cluster (it must be created OUT OF BAND — it is
# what Flux uses to decrypt every other SOPS-encrypted secret, so it can
# never itself be SOPS-encrypted or committed in plaintext).
#   kubectl create secret generic sops-age -n flux-system --from-file=age.agekey=./age.agekey
apiVersion: v1
kind: Secret
metadata:
    name: sops-age
    namespace: flux-system
stringData:
    age.agekey: REPLACE_WITH_YOUR_OWN_AGE_PRIVATE_KEY_FROM_age-keygen
type: Opaque
