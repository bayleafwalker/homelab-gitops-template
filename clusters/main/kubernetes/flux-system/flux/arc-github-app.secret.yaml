# Sample only — fill in your GitHub App's real ID/installation ID/private key
# (see docs/github-actions-runner.md for how to obtain them) and re-encrypt
# with sops/age before committing. Never commit real key material in plaintext.
apiVersion: v1
kind: Secret
metadata:
    name: arc-github-app
    namespace: flux-system
    annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: arc-runners
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: arc-runners
type: Opaque
stringData:
    github_app_id: "REPLACE_WITH_GITHUB_APP_ID"
    github_app_installation_id: "REPLACE_WITH_GITHUB_APP_INSTALLATION_ID"
    github_app_private_key: |
        -----BEGIN RSA PRIVATE KEY-----
        REPLACE_WITH_YOUR_GITHUB_APP_PRIVATE_KEY_PEM
        -----END RSA PRIVATE KEY-----
