# Sample only — generate your own deploy keypair (e.g. `ssh-keygen -t ecdsa -b 384`),
# add the public half as a read-only deploy key on your Git repo, capture the
# real `known_hosts` line with `ssh-keyscan github.com`, and re-encrypt with
# sops/age before committing. Never commit real key material in plaintext.
apiVersion: v1
kind: Secret
metadata:
    name: deploy-key
    namespace: flux-system
stringData:
    identity: |
        -----BEGIN EC PRIVATE KEY-----
        REPLACE_WITH_YOUR_GENERATED_PRIVATE_KEY
        -----END EC PRIVATE KEY-----
    identity.pub: |
        ecdsa-sha2-nistp384 REPLACE_WITH_YOUR_GENERATED_PUBLIC_KEY
    known_hosts: github.com ecdsa-sha2-nistp256 REPLACE_WITH_OUTPUT_OF_ssh-keyscan_github.com
type: Opaque
