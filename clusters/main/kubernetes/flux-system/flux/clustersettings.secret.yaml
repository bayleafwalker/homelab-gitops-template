# Sample only — replace every value below with your own before applying,
# then re-encrypt this file with sops/age before committing. Despite the
# `.secret.yaml` suffix this is a ConfigMap (cluster-config); it still
# carries environment-specific IPs, domains, and hostnames.
#
# Keep this file aligned with clusters/main/clusterenv.yaml. ClusterTool 3.x
# expects CLUSTERNAME near the bottom of this ConfigMap; keeping it there avoids
# duplicate-key output while preserving direct Talos/Flux usability.
apiVersion: v1
kind: ConfigMap
metadata:
    name: cluster-config
    namespace: flux-system
data:
    # 1. Cluster identity and Talos/ClusterTool compatibility values
    UPGRADE_NODE_LABEL: upgrade.example.com/enabled
    NTP_SERVER: time.cloudflare.com
    HOMELAB_API_VIP: 192.168.1.10
    VIP: 192.168.1.10
    MASTER1IP: 192.168.1.11

    # 2. Physical node inventory for Talos machine config generation
    CONTROL1_IP: 192.168.1.11
    CONTROL1_CIDR: 192.168.1.11/24
    CONTROL1_MAC: 00:11:22:33:44:51
    CONTROL2_IP: 192.168.1.12
    CONTROL2_CIDR: 192.168.1.12/24
    CONTROL2_MAC: 00:11:22:33:44:52
    CONTROL3_IP: 192.168.1.13
    CONTROL3_CIDR: 192.168.1.13/24
    CONTROL3_MAC: 00:11:22:33:44:53
    GPU_WORKER1_IP: 192.168.1.51
    WORKER1_IP: 192.168.1.61
    WORKER2_IP: 192.168.1.62
    WORKER3_IP: 192.168.1.63
    WORKER4_IP: 192.168.1.64

    # 3. Network plan
    LAN_CIDR: 192.168.1.0/24
    GATEWAY: 192.168.1.1
    CLUSTER_NODE_GATEWAY: 192.168.1.1
    CLUSTER_NODE_CIDR: 192.168.1.0/24
    PODNET: 172.16.0.0/16
    SVCNET: 172.17.0.0/16
    KUBERNETES_SERVICE_HOST_IP: 172.17.0.1
    KUBERNETES_SERVICE_HOST_CIDR: 172.17.0.1/32
    TRUSTED_VPN_CIDR: 10.0.0.0/24
    HOMELAB_METALLB_RANGE: 192.168.1.200-192.168.1.220
    HOMELAB_LB_START: 192.168.1.200
    HOMELAB_LB_STOP: 192.168.1.220
    METALLB_RANGE: 192.168.1.200-192.168.1.220
    GATEWAY_INTERNAL_IP: 192.168.1.219
    POSTGRES_LB_IP: 192.168.1.220
    REGISTRY_IP: 192.168.1.221
    REGISTRY_HOST: registry.apps.example.com
    REGISTRY_SERVICE_ENDPOINT: docker-registry.registry.svc.cluster.local:5000
    FORGEJO_SSH_IP: 192.168.1.218
    SHELL_IP: 192.168.1.217
    LDAP_OUTPOST_IP: 192.168.1.216
    HEADLAMP_IP: 192.168.1.215
    BLOCKY_IP: 192.168.1.205
    OMADA_IP: 192.168.1.206
    AUTHENTIK_DIRECTORY_BACKEND_CIDR: 192.168.1.59/32

    # 4. Domains, DNS, and certificates
    DOMAIN_0: apps.example.com
    DOMAIN_HOST: example.com
    DOMAIN_0_EMAIL: you@example.com
    DC_0: example
    DC_1: com
    DN: dc=example, dc=com
    GITHUB_REPOSITORY: git@github.com:your-username/your-homelab-repo.git

    # 5. Storage and backups
    TRUENAS_IP: 192.168.1.33
    HETZNER_S3_BUCKET_NAME: your-bucket-name
    HETZNER_S3_BUCKET_ENDPOINT: hel1.your-objectstorage.com
    S3_BACKUP_BUCKET: your-backup-bucket-name
    S3_BACKUP_ENDPOINT: s3.your-objectstorage.com

    # 6. Core platform/app non-secret defaults
    NEXTCLOUD_USERNAME: admin

    # 7. Optional integrations
    NORDVPN_COUNTRY: Switzerland
    NORDVPN_SERVER: ch000.nordvpn.com
    MOSQUITTO_USERNAME: homelab_mosquitto
    HOMEASSISTANT_URL: homeassistant.example.com
    HOMEASSISTANT_USERNAME: bot
    CLUSTERNAME: homelab
