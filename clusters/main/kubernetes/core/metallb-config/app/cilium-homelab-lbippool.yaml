apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab
spec:
  serviceSelector:
    matchLabels:
      homelab.dev/lb-pool: homelab
  blocks:
    # Replace with a free range from your own LAN (must not overlap DHCP).
    - start: ${HOMELAB_LB_START}
      stop: ${HOMELAB_LB_STOP}
