---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: mosquitto
spec:
  interval: 15m
  chart:
    spec:
      chart: mosquitto
      version: 18.3.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    service:
      main:
        type: NodePort
        externalTrafficPolicy: Cluster
        ports:
          main:
            enabled: true
            port: 1883
            nodePort: 31883
            protocol: tcp
    persistence:
      data:
        enabled: true
        mountPath: /mosquitto/data
        type: pvc
        storageClass: longhorn
        size: 1Gi
      # Disable extra include-dir persistence to avoid another PVC on small eMMC nodes.
      configinc:
        enabled: false
