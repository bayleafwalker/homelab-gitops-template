apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-actions-runner
  namespace: flux-system
spec:
  interval: 30m
  path: ./clusters/main/kubernetes/system/github-actions-runner/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: cluster

