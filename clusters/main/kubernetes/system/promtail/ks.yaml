apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: promtail
  namespace: flux-system
spec:
  interval: 10m
  path: clusters/main/kubernetes/system/promtail/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
  dependsOn:
    - name: loki
