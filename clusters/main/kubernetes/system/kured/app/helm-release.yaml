---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: kured
spec:
  interval: 30m
  chart:
    spec:
      chart: kured
      version: 5.12.0
      sourceRef:
        kind: HelmRepository
        name: kubereboot
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    configuration:
      startTime: "04:00"
      endTime: "06:00"
      timeZone: "Europe/Helsinki"
      concurrency: 1
      drainTimeout: "20m"
      skipWaitForDeleteTimeout: 120
      lockTtl: 60m
      annotateNodes: true
      preferNoScheduleTaint: "homelab.dev/reboot-pending"
      prometheusUrl: "http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc.cluster.local:9090"
      alertFiringOnly: true
      alertFilterRegexp: "Watchdog|InfoInhibitor"
    metrics:
      create: true
      namespace: kured
      labels:
        release: kube-prometheus-stack
    service:
      create: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
