---
# Daily backup of all Longhorn volumes
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 3 * * *"
  task: "backup"
  groups:
    - default
  retain: 14
  concurrency: 2
---
# Weekly backup of all volumes on Sunday at 1 AM
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-full-backup
  namespace: longhorn-system
spec:
  cron: "0 1 * * 0"
  task: "backup"
  groups:
    - default
  retain: 4
  concurrency: 2
  labels:
    backup: weekly
