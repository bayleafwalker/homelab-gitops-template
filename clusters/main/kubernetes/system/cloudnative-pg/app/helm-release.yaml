apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: cloudnative-pg
    namespace: cloudnative-pg
spec:
    interval: 5m
    chart:
        spec:

            chart: cloudnative-pg
            version: 8.2.0
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
            interval: 5m
    install:
        createNamespace: true
        crds: CreateReplace
        remediation:
            retries: 3
    upgrade:
        crds: CreateReplace
        remediation:
            retries: 3
    values:
        # Upstream cloudnative-pg chart defaults to a read-only root filesystem.
        # In our cluster this prevents the operator from starting (exit code 2),
        # which in turn breaks the admission webhooks required by CNPG resources.
        cloudnative-pg:
            containerSecurityContext:
                readOnlyRootFilesystem: false
