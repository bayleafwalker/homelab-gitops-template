apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  interval: 5m
  chart:
    spec:
      chart: loki
      version: 7.0.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      useTestSchema: true
      limits_config:
        retention_period: 168h
        reject_old_samples: true
        reject_old_samples_max_age: 2160h
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: filesystem

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 50Gi
        storageClass: longhorn

    # Ensure only SingleBinary components are deployed.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    # Keep the deployment light for a homelab.
    resultsCache:
      enabled: false
    chunksCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false

    gateway:
      verboseLogging: false

    monitoring:
      serviceMonitor:
        enabled: true
