---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: goldilocks
spec:
  interval: 30m
  chart:
    spec:
      chart: goldilocks
      version: 10.3.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controller:
      flags:
        on-by-default: false
      resources:
        requests:
          cpu: 35m
          memory: 100Mi
        limits:
          memory: 256Mi
    dashboard:
      resources:
        requests:
          cpu: 15m
          memory: 100Mi
        limits:
          memory: 256Mi
      ingress:
        enabled: false
