apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      serviceAccountName: forgejo-runner
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-runner-data
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /data/cache /data/workdir && chown -R 1000:1000 /data
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
          volumeMounts:
            - name: runner-data
              mountPath: /data
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:12.10.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until nc -z 127.0.0.1 2375; do
                sleep 1
              done
              rm -f /data/.runner
              exec forgejo-runner daemon --config /data/runner-config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /data/runner-config.yaml
              subPath: runner-config.yaml
              readOnly: true
        - name: docker-in-docker
          image: docker:28.1.1-dind
          imagePullPolicy: IfNotPresent
          args:
            - dockerd
            - -H
            - tcp://0.0.0.0:2375
            - --tls=false
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
        - name: docker-pruner
          image: docker:28.1.1-cli
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until docker info >/dev/null 2>&1; do
                sleep 5
              done
              while true; do
                docker system prune --all --force --filter "until=168h"
                docker builder prune --all --force --filter "until=168h"
                sleep 21600
              done
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
            - name: HOME
              value: /tmp
            - name: DOCKER_CONFIG
              value: /tmp/.docker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: runner-data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: dind-storage
          persistentVolumeClaim:
            claimName: forgejo-runner-dind
        - name: runner-config
          secret:
            secretName: forgejo-runner-config
