# This Secret holds forgejo-runner's *generated* registration state
# (`.runner`) plus its static config (`runner-config.yaml`).
#
# `.runner` is produced by `forgejo-runner register` the first time the runner
# starts — it is not something you hand-author. The values below are
# placeholders showing the expected shape; after you register a runner against
# your own Forgejo instance, replace this Secret's contents with the real
# generated file and re-encrypt it with SOPS before committing
# (see docs/secrets.md and docs/forgejo.md).
apiVersion: v1
kind: Secret
metadata:
    name: forgejo-runner-config
    namespace: forgejo-runner
type: Opaque
stringData:
    runner-config.yaml: |
        log:
          level: info
        runner:
          capacity: 1
          envs:
            DOCKER_HOST: tcp://dind.docker.internal:2375
          labels:
            - ubuntu-22.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04
            - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04
        host:
          workdir_parent: /data/workdir
        container:
          docker_host: tcp://127.0.0.1:2375
          options: --add-host=dind.docker.internal:host-gateway
        cache:
          enabled: true
          dir: /data/cache
        server:
          connections:
            forgejo:
              url: http://forgejo-gitea-http.forgejo.svc.cluster.local:3000/
              uuid: REPLACE_WITH_RUNNER_UUID
              token: REPLACE_WITH_RUNNER_REGISTRATION_TOKEN
    .runner: |
        {
          "WARNING": "This file is automatically generated by forgejo-runner. Do not edit it manually unless you know what you are doing. Removing this file will cause act runner to re-register as a new runner.",
          "id": 1,
          "uuid": "REPLACE_WITH_RUNNER_UUID",
          "name": "runner-1",
          "token": "REPLACE_WITH_RUNNER_REGISTRATION_TOKEN",
          "address": "https://git.example.com/",
          "labels": [
            "ubuntu-22.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04",
            "ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04"
          ]
        }
