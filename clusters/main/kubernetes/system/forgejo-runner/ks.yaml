apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-runner
  namespace: flux-system
spec:
  interval: 30m
  path: ./clusters/main/kubernetes/system/forgejo-runner/app
  prune: true
  wait: true
  dependsOn:
    - name: forgejo
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: cluster
