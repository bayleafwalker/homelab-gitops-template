apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: kube-prometheus-stack
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 86.1.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    prometheusOperator:
      enabled: true
      serviceMonitor:
        selfMonitor: false
      livenessProbe:
        timeoutSeconds: 3
      readinessProbe:
        timeoutSeconds: 3
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi

    # Enable the full monitoring stack (Prometheus + Grafana + Alertmanager).
    # Default kube-prometheus rules expect some components that aren't present
    # in this Talos + Cilium setup (e.g. kube-proxy), so we disable those rules.
    defaultRules:
      create: true
      rules:
        etcd: false
        kubeProxy: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        windows: false

    windowsMonitoring:
      enabled: false
    prometheus-windows-exporter:
      prometheus:
        monitor:
          enabled: false

    kubernetesServiceMonitors:
      enabled: true

    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    coreDns:
      enabled: true
    kubeDns:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 384Mi
    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      livenessProbe:
        timeoutSeconds: 3
      readinessProbe:
        timeoutSeconds: 3
      resources:
        requests:
          cpu: 20m
          memory: 100Mi
        limits:
          memory: 256Mi

    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - source_matchers:
              - "severity = critical"
            target_matchers:
              - "severity =~ warning|info"
            equal:
              - namespace
              - alertname
          - source_matchers:
              - "severity = warning"
            target_matchers:
              - "severity = info"
            equal:
              - namespace
              - alertname
          - source_matchers:
              - "alertname = InfoInhibitor"
            target_matchers:
              - "severity = info"
            equal:
              - namespace
          - target_matchers:
              - "alertname = InfoInhibitor"
        route:
          group_by:
            - namespace
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "null"
          routes:
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
            - receiver: homeassistant-critical
              matchers:
                - severity =~ "critical|error"
            - receiver: homeassistant-warning
              repeat_interval: 24h
              matchers:
                - severity = "warning"
        receivers:
          - name: "null"
          - name: homeassistant-critical
            webhook_configs:
              - url: "https://${HOMEASSISTANT_URL}/api/events/alertmanager"
                send_resolved: true
                http_config:
                  bearer_token_file: /etc/alertmanager/secrets/homeassistant-token/token
          - name: homeassistant-warning
            webhook_configs:
              - url: "https://${HOMEASSISTANT_URL}/api/events/alertmanager"
                send_resolved: false
                http_config:
                  bearer_token_file: /etc/alertmanager/secrets/homeassistant-token/token
        templates:
          - /etc/alertmanager/config/*.tmpl
      ingress:
        enabled: false
        ingressClassName: internal
        annotations:
          cert-manager.io/cluster-issuer: domain-0-le-prod
          nginx.ingress.kubernetes.io/auth-url: |-
            http://authentik-outpost.kube-prometheus-stack.svc.cluster.local:10230/outpost.goauthentik.io/auth/nginx
          nginx.ingress.kubernetes.io/auth-signin: |-
            https://$http_host/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
          nginx.ingress.kubernetes.io/auth-response-headers: |-
            Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid
          nginx.ingress.kubernetes.io/auth-snippet: |
            proxy_set_header X-Forwarded-Host $http_host;
        hosts:
          - alertmanager.${DOMAIN_0}
        paths:
          - /
        tls:
          - secretName: alertmanager-tls
            hosts:
              - alertmanager.${DOMAIN_0}
      alertmanagerSpec:
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 256Mi
        secrets:
          - homeassistant-token
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi

    grafana:
      enabled: true
      defaultDashboardsEnabled: true
      grafana.ini:
        analytics:
          reporting_enabled: false
          check_for_updates: false
          check_for_plugin_updates: false
          feedback_links_enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
        limits:
          memory: 1Gi
      sidecar:
        resources:
          requests:
            cpu: 40m
            memory: 128Mi
          limits:
            memory: 256Mi
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.loki.svc.cluster.local:3100
          editable: false
      ingress:
        enabled: false
        ingressClassName: internal
        annotations:
          cert-manager.io/cluster-issuer: domain-0-le-prod
          nginx.ingress.kubernetes.io/auth-url: |-
            http://authentik-outpost.kube-prometheus-stack.svc.cluster.local:10230/outpost.goauthentik.io/auth/nginx
          nginx.ingress.kubernetes.io/auth-signin: |-
            https://$http_host/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
          nginx.ingress.kubernetes.io/auth-response-headers: |-
            Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid
          nginx.ingress.kubernetes.io/auth-snippet: |
            proxy_set_header X-Forwarded-Host $http_host;
        hosts:
          - grafana.${DOMAIN_0}
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.${DOMAIN_0}
      persistence:
        enabled: true
        type: sts
        accessModes:
          - ReadWriteOnce
        size: 5Gi
        finalizers:
          - kubernetes.io/pvc-protection

    prometheus:
      enabled: true
      ingress:
        enabled: false
        ingressClassName: internal
        annotations:
          cert-manager.io/cluster-issuer: domain-0-le-prod
          nginx.ingress.kubernetes.io/auth-url: |-
            http://authentik-outpost.kube-prometheus-stack.svc.cluster.local:10230/outpost.goauthentik.io/auth/nginx
          nginx.ingress.kubernetes.io/auth-signin: |-
            https://$http_host/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
          nginx.ingress.kubernetes.io/auth-response-headers: |-
            Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid
          nginx.ingress.kubernetes.io/auth-snippet: |
            proxy_set_header X-Forwarded-Host $http_host;
        hosts:
          - prometheus.${DOMAIN_0}
        paths:
          - /
        tls:
          - secretName: prometheus-tls
            hosts:
              - prometheus.${DOMAIN_0}
      prometheusSpec:
        retention: 15d
        resources:
          requests:
            cpu: 750m
            memory: 4Gi
          limits:
            memory: 6Gi
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        probeSelectorNilUsesHelmValues: false
        probeSelector: {}
        probeNamespaceSelector: {}
        scrapeConfigSelectorNilUsesHelmValues: false
        scrapeConfigSelector: {}
        scrapeConfigNamespaceSelector: {}
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 50Gi
