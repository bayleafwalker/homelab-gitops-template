# Sample only — replace with your own values and re-encrypt with sops/age
# before committing. `database`/`username` can stay simple identifiers;
# `password`/`passphrase` should be freshly generated random secrets.
apiVersion: v1
kind: Secret
metadata:
    name: obsidian-livesync-credentials
    namespace: couchdb
type: Opaque
stringData:
    database: obsidianlivesync
    username: livesync
    password: REPLACE_WITH_RANDOM_PASSWORD
    passphrase: REPLACE_WITH_RANDOM_PASSPHRASE
