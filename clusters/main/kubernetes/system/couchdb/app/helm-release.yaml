---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: couchdb
  namespace: couchdb
spec:
  interval: 15m
  chart:
    spec:
      chart: couchdb
      version: 4.6.3
      sourceRef:
        kind: HelmRepository
        name: apache
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    couchdbConfig:
      couchdb:
        uuid: "85fb71da700c17267fef77535bd58fc5"
        max_document_size: "50000000"
      chttpd:
        bind_address: "0.0.0.0"
        enable_cors: "true"
        max_http_request_size: "4294967296"
      httpd:
        enable_cors: "true"
      cors:
        credentials: "true"
        origins: "app://obsidian.md,capacitor://localhost,http://localhost"
    allowAdmins: true
    adminUsername: admin
    clusterSize: 1
    service:
      type: ClusterIP
      port: 5984
    persistence:
      enabled: true
      storageClass: couchdb
      size: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
  valuesFrom:
    - kind: Secret
      name: couchdb-credentials
      valuesKey: admin-password
      targetPath: adminPassword
