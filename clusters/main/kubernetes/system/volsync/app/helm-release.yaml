apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: volsync
    namespace: volsync
spec:
    interval: 5m
    chart:
        spec:
            chart: volsync
            version: 4.3.0
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
            interval: 5m
    install:
        timeout: 10m
        createNamespace: true
        remediation:
            retries: 3
    upgrade:
        timeout: 10m
        remediation:
            retries: 3
