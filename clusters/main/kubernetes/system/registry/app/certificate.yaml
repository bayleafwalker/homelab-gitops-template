---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: docker-registry-tls
  namespace: registry
spec:
  secretName: docker-registry-tls
  issuerRef:
    name: domain-0-le-prod
    kind: ClusterIssuer
  dnsNames:
    - registry.${DOMAIN_0}
  privateKey:
    algorithm: RSA
    size: 2048
