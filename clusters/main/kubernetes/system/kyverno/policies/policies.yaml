---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: homelab-baseline-audit
  annotations:
    policies.kyverno.io/title: Homelab baseline audit
    policies.kyverno.io/category: Homelab
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-namespaced-workload-owner-labels
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
      validate:
        message: "Workloads should carry app.kubernetes.io/name for ownership and policy targeting."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
    - name: audit-mutable-container-tags
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Container images should avoid mutable latest tags."
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
          - list: "request.object.spec.initContainers[] || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
    - name: restrict-privileged-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - forgejo-runner
                - kube-system
                - longhorn-system
                - metallb-system
      validate:
        message: "Privileged containers require an explicit namespace exception."
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.privileged || `false` }}"
                    operator: Equals
                    value: true
          - list: "request.object.spec.initContainers[] || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.privileged || `false` }}"
                    operator: Equals
                    value: true
