# Sample only — generate a real talosconfig with restricted access for backups
# (e.g. `talosctl config new --roles os:etcd:backup <name>`), base64-encode it
# into `data.config` (or use stringData with the raw YAML), and re-encrypt this
# file with sops/age before committing. Never commit a real talosconfig —
# it carries a client certificate and private key that grant cluster access.
apiVersion: v1
kind: Secret
metadata:
    name: talos
    namespace: etcd-backup
stringData:
    config: |
        context: main
        contexts:
            main:
                endpoints:
                    - 192.168.1.11
                nodes:
                    - 192.168.1.11
                ca: REPLACE_WITH_YOUR_TALOS_CA_CERT_BASE64
                crt: REPLACE_WITH_YOUR_TALOS_CLIENT_CERT_BASE64
                key: REPLACE_WITH_YOUR_TALOS_CLIENT_KEY_BASE64
