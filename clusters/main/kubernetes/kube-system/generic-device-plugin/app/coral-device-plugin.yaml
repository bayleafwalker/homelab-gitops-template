apiVersion: apps/v1
kind: Deployment
metadata:
  name: coral-device-plugin
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coral-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coral-device-plugin
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-gpu-1
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: coral-device-plugin
          image: ghcr.io/squat/generic-device-plugin:latest
          args:
            - "--domain"
            - "coral.ai"
            - "--device"
            - |
              name: tpu
              groups:
                - count: 1
                  paths:
                    - path: /dev/apex_0
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
