---
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
  namespace: gpu-operator
data:
  any: |
    version: v1
    flags:
      migStrategy: "none"
      failOnInitError: false
      nvidiaDriverRoot: "/"
      nvidiaDevRoot: "/"
      deviceDiscoveryStrategy: "nvml"
      plugin:
        passDeviceSpecs: true
        deviceListStrategy:
          - envvar
        deviceIDStrategy: uuid
      resources:
        gpus:
          - pattern: "*"
            name: nvidia.com/gpu
    sharing:
      timeSlicing:
        resources:
          - name: nvidia.com/gpu
            replicas: 3
