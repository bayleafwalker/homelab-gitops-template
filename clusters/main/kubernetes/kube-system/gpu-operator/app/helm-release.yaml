# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 30m
  timeout: 20m
  maxHistory: 3
  chart:
    spec:
      chart: gpu-operator
      version: v26.3.2
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Talos manages the kernel module and container toolkit via system extensions
    driver:
      enabled: false
    toolkit:
      enabled: false
    devicePlugin:
      enabled: true
      config:
        name: time-slicing-config
        default: any
    dcgm:
      enabled: false
    dcgmExporter:
      enabled: false
    gfd:
      enabled: true
    migManager:
      enabled: false
    nodeStatusExporter:
      enabled: true
    operator:
      defaultRuntime: containerd
