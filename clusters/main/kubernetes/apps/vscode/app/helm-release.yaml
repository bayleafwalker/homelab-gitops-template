---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vscode
  namespace: vscode
spec:
  interval: 15m
  chart:
    spec:
      chart: code-server
      version: 15.5.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Portal configuration
    portal:
      open:
        enabled: false
    
    # Global settings
    global:
      stopAll: false
    
    # Ingress configuration with HTTPS via cert-manager
    ingress:
      main:
        enabled: false
        primary: true
        ingressClassName: internal
        annotations:
          nginx.ingress.kubernetes.io/auth-url: |-
            http://authentik-outpost.vscode.svc.cluster.local:10230/outpost.goauthentik.io/auth/nginx
          nginx.ingress.kubernetes.io/auth-signin: |-
            https://$http_host/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
          nginx.ingress.kubernetes.io/auth-response-headers: |-
            Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid
          nginx.ingress.kubernetes.io/auth-snippet: |
            proxy_set_header X-Forwarded-Host $http_host;
        hosts:
          - host: code.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        tls:
          - hosts:
              - code.${DOMAIN_0}
            secretName: vscode-tls
    
    # Security context - run as non-root with sudo capabilities
    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        capabilities:
          add:
            - SETUID
            - SETGID
    
    # Resource limits and requests
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 50m
        memory: 512Mi
    
    # Persistence for workspace and settings
    persistence:
      config:
        enabled: true
        type: pvc
        storageClass: longhorn
        size: 10Gi
        mountPath: /config
      workspace:
        enabled: true
        existingClaim: truenas-workspace-pvc
        mountPath: /workspace
      tools:
        enabled: true
        type: emptyDir
        mountPath: /tools
    
    # Code-server specific configuration
    workingDir: /workspace
    
    # Workload configuration for TrueCharts
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PROXY_DOMAIN: "code.${DOMAIN_0}"
                PATH: "/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
                # Enable official VS Code marketplace for GitHub Copilot
                EXTENSIONS_GALLERY: '{"serviceUrl":"https://marketplace.visualstudio.com/_apis/public/gallery","cacheUrl":"https://vscode.blob.core.windows.net/gallery/index","itemUrl":"https://marketplace.visualstudio.com/items","controlUrl":"","recommendationsUrl":""}'
                ITEM_URL: "https://marketplace.visualstudio.com/items"
                SERVICE_URL: "https://marketplace.visualstudio.com/_apis/public/gallery"
              lifecycle:
                postStart:
                  type: exec
                  command:
                    - /bin/sh
                    - -c
                    - |
                      if [ ! -f /tools/kubectl ]; then
                        cd /tmp
                        wget -q https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl
                        wget -q https://github.com/siderolabs/talos/releases/download/v1.11.5/talosctl-linux-amd64 -O talosctl
                        wget -q https://github.com/fluxcd/flux2/releases/download/v2.7.3/flux_2.7.3_linux_amd64.tar.gz
                        wget -q https://get.helm.sh/helm-v3.17.0-linux-amd64.tar.gz
                        tar -xzf flux_2.7.3_linux_amd64.tar.gz flux
                        tar -xzf helm-v3.17.0-linux-amd64.tar.gz linux-amd64/helm --strip-components=1
                        chmod +x kubectl talosctl flux helm
                        mv kubectl talosctl flux helm /tools/
                        rm -f *.tar.gz
                      fi
              volumeMounts:
                tools:
                  mountPath: /tools
    
    # Service configuration
    service:
      main:
        ports:
          main:
            port: 8443
            targetPort: 8443
            protocol: http
  valuesFrom:
    - kind: Secret
      name: vscode-admin-creds
      valuesKey: password
      targetPath: workload.main.podSpec.containers.main.env.PASSWORD
    - kind: Secret
      name: vscode-admin-creds
      valuesKey: password
      targetPath: workload.main.podSpec.containers.main.env.SUDO_PASSWORD
