apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-restore-drill
  namespace: authentik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-restore-drill
  namespace: authentik
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-restore-drill
  namespace: authentik
subjects:
  - kind: ServiceAccount
    name: cnpg-restore-drill
    namespace: authentik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-restore-drill
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-restore-drill
  namespace: authentik
spec:
  schedule: "17 6 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: cnpg-restore-drill
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drill
              image: public.ecr.aws/bitnami/kubectl:1.33.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu

                  ns="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
                  cluster="authentik-cnpg-main"
                  restore="authentik-cnpg-restore-drill"
                  kubectl="/opt/bitnami/kubectl/bin/kubectl"

                  if [ ! -x "$kubectl" ]; then
                    echo "kubectl not found at $kubectl"
                    exit 1
                  fi

                  image="$("$kubectl" -n "$ns" get clusters.postgresql.cnpg.io "$cluster" -o jsonpath='{.spec.imageName}')"
                  if [ -z "$image" ]; then
                    echo "Unable to determine imageName for $cluster"
                    exit 1
                  fi

                  backups="$(
                    "$kubectl" -n "$ns" get backups.postgresql.cnpg.io \
                      -l "cnpg.io/cluster=$cluster" \
                      -o jsonpath='{range .items[*]}{.metadata.creationTimestamp}{"\t"}{.metadata.name}{"\t"}{.status.phase}{"\n"}{end}'
                  )"
                  backup="$(printf '%s\n' "$backups" | awk '$3=="completed"{print $1"\t"$2}' | sort | tail -n 1 | cut -f2)"

                  if [ -z "$backup" ]; then
                    echo "No completed backups found for $cluster"
                    exit 1
                  fi

                  "$kubectl" -n "$ns" delete clusters.postgresql.cnpg.io "$restore" --ignore-not-found --wait=true

                  cat <<EOF | "$kubectl" -n "$ns" apply -f -
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: $restore
                  spec:
                    instances: 1
                    imageName: $image
                    bootstrap:
                      recovery:
                        backup:
                          name: $backup
                        secret:
                          name: authentik-cnpg-main-user
                    storage:
                      pvcTemplate:
                        accessModes: ["ReadWriteOnce"]
                        resources:
                          requests:
                            storage: 10Gi
                    walStorage:
                      pvcTemplate:
                        accessModes: ["ReadWriteOnce"]
                        resources:
                          requests:
                            storage: 10Gi
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                                - key: node-role.kubernetes.io/control-plane
                                  operator: DoesNotExist
                    resources:
                      requests:
                        cpu: 25m
                        memory: 256Mi
                      limits:
                        cpu: 1500m
                        memory: 2400Mi
                  EOF

                  "$kubectl" -n "$ns" wait --for=condition=Ready --timeout=30m clusters.postgresql.cnpg.io/"$restore"
                  "$kubectl" -n "$ns" delete clusters.postgresql.cnpg.io "$restore" --wait=true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
