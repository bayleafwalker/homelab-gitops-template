apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 15m
  chart:
    spec:
      chart: authentik
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      version: 40.7.4
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    podOptions:
      defaultAffinity: false
      defaultSpread: false
    credentials:
      hetzner-s3:
        type: s3
        url: https://${HETZNER_S3_BUCKET_ENDPOINT}
        bucket: ${HETZNER_S3_BUCKET_NAME}
        path: backups
    ingress:
      main:
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        enabled: true
        primary: true
        ingressClassName: internal
        hosts:
          - host: auth.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
              - path: /outpost.goauthentik.io
                pathType: ImplementationSpecific
        integrations:
          nginx: 
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
    authentik:
      credentials:
        email: "info@${DOMAIN_0}"
    workload:
      worker:
        podSpec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: authentik
                      pod.name: main
    outposts:
      ldap:
        enabled: true
        service:
          port: 389             # StartTLS
        tls:
          enabled: true         # LDAPS on 636
        baseDn: "${DN}"
          #existingSecret: ldap-outpost-token
    persistence:
      data:
        enabled: true
        mountPath: /data          # required by TrueCharts/common
        size: 5Gi
      blueprints:
        enabled: true
        type: configmap
        objectName: authentik-blueprints
        mountPath: /blueprints/custom
    configmap:
      authentik-blueprints:
        enabled: true
        data:
          k8s-forward-auth.yaml: |
            version: 1
            metadata:
              name: Homelab - Kubernetes forward auth (single application)
            entries:
              - model: authentik_providers_proxy.proxyprovider
                id: grafana-forward-auth
                identifiers:
                  name: grafana-forward-auth
                attrs:
                  name: grafana-forward-auth
                  mode: proxy
                  external_host: https://grafana.${DOMAIN_0}
                  internal_host: http://kube-prometheus-stack-grafana.kube-prometheus-stack.svc.cluster.local:80
                  authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
                  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                  invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

              - model: authentik_core.application
                identifiers:
                  slug: grafana-forward-auth
                attrs:
                  name: Grafana (forward auth)
                  provider: !KeyOf grafana-forward-auth

              - model: authentik_providers_proxy.proxyprovider
                id: prometheus-forward-auth
                identifiers:
                  name: prometheus-forward-auth
                attrs:
                  name: prometheus-forward-auth
                  mode: proxy
                  external_host: https://prometheus.${DOMAIN_0}
                  internal_host: http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc.cluster.local:9090
                  authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
                  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                  invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

              - model: authentik_core.application
                identifiers:
                  slug: prometheus-forward-auth
                attrs:
                  name: Prometheus (forward auth)
                  provider: !KeyOf prometheus-forward-auth

              - model: authentik_providers_proxy.proxyprovider
                id: alertmanager-forward-auth
                identifiers:
                  name: alertmanager-forward-auth
                attrs:
                  name: alertmanager-forward-auth
                  mode: proxy
                  external_host: https://alertmanager.${DOMAIN_0}
                  internal_host: http://kube-prometheus-stack-alertmanager.kube-prometheus-stack.svc.cluster.local:9093
                  authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
                  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                  invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

              - model: authentik_core.application
                identifiers:
                  slug: alertmanager-forward-auth
                attrs:
                  name: Alertmanager (forward auth)
                  provider: !KeyOf alertmanager-forward-auth

              - model: authentik_providers_proxy.proxyprovider
                id: goldilocks-forward-auth
                identifiers:
                  name: goldilocks-forward-auth
                attrs:
                  name: goldilocks-forward-auth
                  mode: forward_single
                  external_host: https://goldilocks.${DOMAIN_0}
                  authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
                  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                  invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

              - model: authentik_core.application
                identifiers:
                  slug: goldilocks-forward-auth
                attrs:
                  name: Goldilocks (forward auth)
                  provider: !KeyOf goldilocks-forward-auth

              - model: authentik_providers_proxy.proxyprovider
                id: goldilocks-proxy
                identifiers:
                  name: goldilocks-proxy
                attrs:
                  name: goldilocks-proxy
                  mode: proxy
                  external_host: https://goldilocks-proxy.${DOMAIN_0}
                  internal_host: http://goldilocks-dashboard.goldilocks.svc.cluster.local:80
                  authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
                  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                  invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

              - model: authentik_core.application
                identifiers:
                  slug: goldilocks-proxy
                attrs:
                  name: Goldilocks (proxy)
                  provider: !KeyOf goldilocks-proxy

              - model: authentik_providers_proxy.proxyprovider
                id: goldilocks-main-proxy
                identifiers:
                  name: goldilocks-main-proxy
                attrs:
                  name: goldilocks-main-proxy
                  mode: proxy
                  external_host: https://goldilocks.${DOMAIN_0}
                  internal_host: http://goldilocks-dashboard.goldilocks.svc.cluster.local:80
                  authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
                  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                  invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

              - model: authentik_core.application
                identifiers:
                  slug: goldilocks-main-proxy
                attrs:
                  name: Goldilocks
                  provider: !KeyOf goldilocks-main-proxy

              - model: authentik_providers_proxy.proxyprovider
                id: registry-forward-auth
                identifiers:
                  name: registry-forward-auth
                attrs:
                  name: registry-forward-auth
                  mode: forward_single
                  external_host: https://registry.${DOMAIN_0}
                  authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
                  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                  invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

              - model: authentik_core.application
                identifiers:
                  slug: registry-forward-auth
                attrs:
                  name: Docker Registry (forward auth)
                  provider: !KeyOf registry-forward-auth

              - model: authentik_providers_proxy.proxyprovider
                id: headlamp-forward-auth
                identifiers:
                  name: headlamp-forward-auth
                attrs:
                  name: headlamp-forward-auth
                  mode: forward_single
                  external_host: https://kube.${DOMAIN_0}
                  authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
                  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                  invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

              - model: authentik_core.application
                identifiers:
                  slug: headlamp-forward-auth
                attrs:
                  name: Headlamp (forward auth)
                  provider: !KeyOf headlamp-forward-auth

              - model: authentik_providers_proxy.proxyprovider
                id: vscode-forward-auth
                identifiers:
                  name: vscode-forward-auth
                attrs:
                  name: vscode-forward-auth
                  mode: forward_single
                  external_host: https://code.${DOMAIN_0}
                  authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
                  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                  invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

              - model: authentik_core.application
                identifiers:
                  slug: vscode-forward-auth
                attrs:
                  name: Code Server (forward auth)
                  provider: !KeyOf vscode-forward-auth

              - model: authentik_outposts.outpost
                identifiers:
                  managed: goauthentik.io/outposts/embedded
                attrs:
                  config:
                    authentik_host: https://auth.${DOMAIN_0}
                    authentik_host_browser: https://auth.${DOMAIN_0}
                  providers:
                    - !KeyOf grafana-forward-auth
                    - !KeyOf prometheus-forward-auth
                    - !KeyOf alertmanager-forward-auth
                    - !KeyOf goldilocks-forward-auth
                    - !KeyOf goldilocks-proxy
                    - !KeyOf goldilocks-main-proxy
                    - !KeyOf registry-forward-auth
                    - !KeyOf headlamp-forward-auth
                    - !KeyOf vscode-forward-auth
          k8s-groups-and-access.yaml: |
            version: 1
            metadata:
              name: Homelab groups and access
            entries:
              - model: authentik_core.group
                identifiers:
                  name: homelab-admin
                attrs:
                  name: homelab-admin
                  is_superuser: true

              - model: authentik_core.group
                identifiers:
                  name: homelab-readonly
                attrs:
                  name: homelab-readonly

              - model: authentik_core.group
                identifiers:
                  name: homelab-media
                attrs:
                  name: homelab-media

              - model: authentik_core.group
                identifiers:
                  name: homelab-robots
                attrs:
                  name: homelab-robots

              - model: authentik_core.group
                identifiers:
                  name: homelab-agents
                attrs:
                  name: homelab-agents

              - model: authentik_core.application
                identifiers:
                  slug: grafana-forward-auth
                attrs:
                  policy_engine_mode: any

              - model: authentik_core.application
                identifiers:
                  slug: prometheus-forward-auth
                attrs:
                  policy_engine_mode: any

              - model: authentik_core.application
                identifiers:
                  slug: alertmanager-forward-auth
                attrs:
                  policy_engine_mode: any

              - model: authentik_core.application
                identifiers:
                  slug: goldilocks-forward-auth
                attrs:
                  policy_engine_mode: any

              - model: authentik_core.application
                identifiers:
                  slug: goldilocks-main-proxy
                attrs:
                  policy_engine_mode: any

              - model: authentik_core.application
                identifiers:
                  slug: registry-forward-auth
                attrs:
                  policy_engine_mode: any

              - model: authentik_core.application
                identifiers:
                  slug: headlamp-forward-auth
                attrs:
                  policy_engine_mode: any

              - model: authentik_core.application
                identifiers:
                  slug: vscode-forward-auth
                attrs:
                  policy_engine_mode: any

              - model: authentik_policies.policybinding
                identifiers:
                  target: !Find [authentik_core.application, [slug, grafana-forward-auth]]
                  order: 0
                attrs:
                  enabled: true
                  group: !Find [authentik_core.group, [name, homelab-admin]]

              - model: authentik_policies.policybinding
                identifiers:
                  target: !Find [authentik_core.application, [slug, grafana-forward-auth]]
                  order: 1
                attrs:
                  enabled: true
                  group: !Find [authentik_core.group, [name, homelab-readonly]]

              - model: authentik_policies.policybinding
                identifiers:
                  target: !Find [authentik_core.application, [slug, prometheus-forward-auth]]
                  order: 0
                attrs:
                  enabled: true
                  group: !Find [authentik_core.group, [name, homelab-admin]]

              - model: authentik_policies.policybinding
                identifiers:
                  target: !Find [authentik_core.application, [slug, prometheus-forward-auth]]
                  order: 1
                attrs:
                  enabled: true
                  group: !Find [authentik_core.group, [name, homelab-readonly]]

              - model: authentik_policies.policybinding
                identifiers:
                  target: !Find [authentik_core.application, [slug, alertmanager-forward-auth]]
                  order: 0
                attrs:
                  enabled: true
                  group: !Find [authentik_core.group, [name, homelab-admin]]

              - model: authentik_policies.policybinding
                identifiers:
                  target: !Find [authentik_core.application, [slug, goldilocks-forward-auth]]
                  order: 0
                attrs:
                  enabled: true
                  group: !Find [authentik_core.group, [name, homelab-admin]]

              - model: authentik_policies.policybinding
                identifiers:
                  target: !Find [authentik_core.application, [slug, goldilocks-main-proxy]]
                  order: 0
                attrs:
                  enabled: true
                  group: !Find [authentik_core.group, [name, homelab-admin]]

              - model: authentik_policies.policybinding
                identifiers:
                  target: !Find [authentik_core.application, [slug, registry-forward-auth]]
                  order: 0
                attrs:
                  enabled: true
                  group: !Find [authentik_core.group, [name, homelab-admin]]

              - model: authentik_policies.policybinding
                identifiers:
                  target: !Find [authentik_core.application, [slug, headlamp-forward-auth]]
                  order: 0
                attrs:
                  enabled: true
                  group: !Find [authentik_core.group, [name, homelab-admin]]

              - model: authentik_policies.policybinding
                identifiers:
                  target: !Find [authentik_core.application, [slug, vscode-forward-auth]]
                  order: 0
                attrs:
                  enabled: true
                  group: !Find [authentik_core.group, [name, homelab-admin]]

              # Paperless-ngx
              - model: authentik_providers_proxy.proxyprovider
                id: paperless-forward-auth
                identifiers:
                  name: paperless-forward-auth
                attrs:
                  name: paperless-forward-auth
                  mode: forward_single
                  external_host: https://paperless.${DOMAIN_0}
                  authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
                  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                  invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

              - model: authentik_core.application
                identifiers:
                  slug: paperless-forward-auth
                attrs:
                  name: Paperless-ngx (forward auth)
                  provider: !KeyOf paperless-forward-auth
                  policy_engine_mode: any

              - model: authentik_policies.policybinding
                identifiers:
                  target: !Find [authentik_core.application, [slug, paperless-forward-auth]]
                  order: 0
                attrs:
                  enabled: true
                  group: !Find [authentik_core.group, [name, homelab-admin]]
    cnpg:
      main:
        backups:
          enabled: true
          credentials: hetzner-s3
          retentionPolicy: "30d"
          encryption:
            enabled: false
          scheduledBackups:
            - name: daily
              schedule: "0 0 2 * * *"
              backupOwnerReference: cluster
              immediate: true
              suspend: false
#  valuesFrom:
#    - kind: Secret
#      name: authentik-admin-creds
#      valuesKey: password
#      targetPath: authentik.credentials.password
  valuesFrom:
    - kind: Secret
      name: authentik-admin-creds
      valuesKey: password
      targetPath: authentik.credentials.password
    - kind: Secret
      name: hetzner-s3
      valuesKey: accessKey
      targetPath: credentials.hetzner-s3.accessKey
    - kind: Secret
      name: hetzner-s3
      valuesKey: secretKey
      targetPath: credentials.hetzner-s3.secretKey
    - kind: Secret
      name: hetzner-s3
      valuesKey: encrKey
      targetPath: credentials.hetzner-s3.encrKey
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: authentik
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: authentik
              spec:
                template:
                  spec:
                    containers:
                      - name: authentik
                        resources:
                          requests:
                            cpu: 25m
                            memory: 256Mi
                          limits:
                            cpu: null
                            memory: 1Gi
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: authentik-worker
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: authentik-worker
              spec:
                template:
                  spec:
                    containers:
                      - name: authentik
                        resources:
                          requests:
                            cpu: 25m
                            memory: 1Gi
                          limits:
                            cpu: null
                            memory: 4Gi
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: authentik-redis
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: authentik-redis
              spec:
                template:
                  spec:
                    containers:
                      - name: authentik-redis
                        resources:
                          requests:
                            cpu: 25m
                            memory: 128Mi
                          limits:
                            cpu: null
                            memory: 512Mi
          - target:
              group: networking.k8s.io
              version: v1
              kind: Ingress
              name: authentik
            patch: |-
              $patch: delete
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: authentik
