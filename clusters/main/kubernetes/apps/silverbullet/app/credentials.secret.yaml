# Sample only — replace with your own random password and re-encrypt with
# sops/age before committing. SilverBullet reads SB_USER as "username:password"
# and requires basic auth when it is set.
apiVersion: v1
kind: Secret
metadata:
  name: silverbullet-credentials
  namespace: silverbullet
type: Opaque
stringData:
  SB_USER: admin:REPLACE_WITH_RANDOM_PASSWORD
