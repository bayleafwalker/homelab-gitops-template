apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silverbullet
  namespace: silverbullet
  labels:
    app.kubernetes.io/name: silverbullet
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silverbullet
  policyTypes:
    - Ingress
  ingress:
    # Only the Cilium/Gateway API ingress path may reach the app.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - protocol: TCP
          port: 3000
