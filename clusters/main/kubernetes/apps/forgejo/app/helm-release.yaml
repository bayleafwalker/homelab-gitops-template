---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 15m
  chart:
    spec:
      chart: gitea
      # Pinned: gitea chart 12.6.0+ uses `gitea config edit-ini --apply-env` which forgejo 15.x does not implement yet
      version: 12.5.3
      sourceRef:
        kind: HelmRepository
        name: gitea
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      registry: codeberg.org
      repository: forgejo/forgejo
      tag: 15.0.2
      rootless: true

    service:
      http:
        type: ClusterIP
        port: 3000
        clusterIP: ""
      ssh:
        type: LoadBalancer
        port: 2222
        loadBalancerIP: ${FORGEJO_SSH_IP}

    persistence:
      enabled: true
      size: 20Gi
      storageClass: longhorn

    strategy:
      type: Recreate

    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

    test:
      enabled: false

    postgresql:
      enabled: false

    postgresql-ha:
      enabled: false

    valkey-cluster:
      enabled: false

    valkey:
      enabled: false

    gitea:
      admin:
        existingSecret: forgejo-admin
        email: forgejo@${DOMAIN_0}
        passwordMode: initialOnlyRequireReset
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      config:
        actions:
          ENABLED: true
          DEFAULT_ACTIONS_URL: https://data.forgejo.org
        database:
          DB_TYPE: postgres
          HOST: forgejo-db-rw.forgejo.svc.cluster.local:5432
          NAME: forgejo
          SSL_MODE: disable
        repository:
          DEFAULT_BRANCH: main
        security:
          INSTALL_LOCK: true
        server:
          DOMAIN: git.${DOMAIN_0}
          ROOT_URL: https://git.${DOMAIN_0}/
          SSH_DOMAIN: forgejo-ssh.${DOMAIN_0}
          SSH_PORT: 2222
          SSH_LISTEN_PORT: 2222
          START_SSH_SERVER: true
        service:
          DISABLE_REGISTRATION: true

    deployment:
      env:
        - name: GITEA__database__USER
          valueFrom:
            secretKeyRef:
              name: forgejo-db-app
              key: username
        - name: GITEA__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-db-app
              key: password

  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: forgejo-gitea-ssh
            patch: |-
              - op: add
                path: /spec/loadBalancerClass
                value: io.cilium/l2-announcer
