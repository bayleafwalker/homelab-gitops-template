apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.13@sha256:acbed84c842730d6cefb89e7135743fe160233296b645b2f30f49fa18e2ebcf1
  storage:
    size: 10Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo