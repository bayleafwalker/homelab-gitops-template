apiVersion: v1
kind: Secret
metadata:
  name: volsync-restic-nextcloud-data
  namespace: nextcloud
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ${HETZNER_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${HETZNER_SECRET_KEY}
  RESTIC_PASSWORD: ${VOLSYNC_RESTIC_PASSWORD}
  RESTIC_REPOSITORY: s3:https://${HETZNER_S3_BUCKET_ENDPOINT}/${HETZNER_S3_BUCKET_NAME}/volsync/nextcloud/nextcloud-data
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: nextcloud-data
  namespace: nextcloud
spec:
  sourcePVC: nextcloud-data-nfs-pvc
  trigger:
    schedule: "32 5 * * *"
  restic:
    moverSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
    repository: volsync-restic-nextcloud-data
    copyMethod: Direct
    # Force a direct-attached cache PVC instead of an RWX share-manager path.
    cacheCapacity: 5Gi
    cacheStorageClassName: longhorn
    cacheAccessModes:
      - ReadWriteOnce
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 3
