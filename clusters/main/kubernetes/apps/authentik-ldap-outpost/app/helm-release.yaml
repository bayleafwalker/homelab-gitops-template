apiVersion: v1
kind: Secret
metadata:
  name: ldap-outpost-token
  namespace: authentik
type: Opaque
stringData:
  token: ${LDAP_OUTPOST_TOKEN}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-ldap-outpost
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-ldap-outpost
    app.kubernetes.io/part-of: authentik
spec:
  replicas: 1
  selector:
    matchLabels: { app: authentik-ldap-outpost }
  template:
    metadata:
      labels:
        app: authentik-ldap-outpost
        app.kubernetes.io/name: authentik-ldap-outpost
        app.kubernetes.io/part-of: authentik
    spec:
      containers:
        - name: ldap
          image: ghcr.io/goauthentik/ldap:2026.2.2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          env:
            - name: AUTHENTIK_HOST
              # Use the in-cluster Service instead of the public ingress hostname.
              # The outpost must be able to reach Authentik's API to fetch its config;
              # using the ingress name can fail due to DNS/hairpin routing.
              value: http://authentik-http.authentik.svc.cluster.local:10230
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ldap-outpost-token
                  key: token
          ports:
            # authentik/ldap runs unprivileged by default, so it listens on high ports.
            # Expose standard ports via Services (389 -> 3389, 636 -> 6636).
            - containerPort: 3389
            - containerPort: 6636
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-ldap-outpost
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-ldap-outpost
    app.kubernetes.io/part-of: authentik
spec:
  selector: { app: authentik-ldap-outpost }
  ports:
    - name: ldap
      port: 389
      targetPort: 3389
    - name: ldaps
      port: 636
      targetPort: 6636
