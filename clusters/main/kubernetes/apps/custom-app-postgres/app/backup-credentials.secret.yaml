# Encrypt this file with sops before committing:
#   sops --encrypt --in-place clusters/main/kubernetes/apps/custom-app-postgres/app/backup-credentials.secret.yaml
#
# S3_ACCESS_KEY / S3_SECRET_KEY come from the cluster-config / cluster-secrets
# ConfigMaps (see docs/secrets.md). REGION should match your S3-compatible
# backup provider (e.g. "us-east-1", "hel1", "auto" for R2/B2).
apiVersion: v1
kind: Secret
metadata:
  name: custom-app-postgres-backup-s3
  namespace: custom-app
type: Opaque
stringData:
  ACCESS_KEY_ID: ${S3_ACCESS_KEY}
  SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
  REGION: us-east-1
