apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: custom-app-postgres
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/main/kubernetes/apps/custom-app-postgres/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  dependsOn:
    - name: cloudnative-pg
    - name: networkpolicies
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: custom-app-postgres
      namespace: custom-app
  timeout: 15m
