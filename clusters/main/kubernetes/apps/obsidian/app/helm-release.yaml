---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsidian
  namespace: obsidian
spec:
  interval: 15m
  chart:
    spec:
      chart: obsidian
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      version: 10.3.0
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    ingress:
      main:
        enabled: false
        primary: true
        ingressClassName: internal
        hosts:
          - host: obsidian.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
    persistence:
      config:
        enabled: true
        mountPath: /config/.config/obsidian
        size: 5Gi
      vaults:
        enabled: true
        existingClaim: obsidian-vaults-nfs-pvc
        mountPath: /vaults
        subPath: Creative
    workload:
      main:
        replicas: 1
