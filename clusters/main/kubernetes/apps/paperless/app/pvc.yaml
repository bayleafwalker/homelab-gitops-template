---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: paperless-nfs
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-data-nfs-pv
spec:
  storageClassName: paperless-nfs
  capacity:
    storage: 1Mi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: truenas.${DOMAIN_HOST}
    path: /mnt/storage_layer/weave/rwx/paperless
  mountOptions:
    - nfsvers=4.1
    - hard
    - tcp
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data-nfs-pvc
  namespace: paperless
spec:
  storageClassName: paperless-nfs
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Mi
